apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: "10.1.4"
    helm:
      releaseName: argocd
      values: |
        configs:
          params:
            server.insecure: "true"
          ssh:
            extraHosts: |
              git.mst.edu ssh-rsa 
              git.mst.edu ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBDtmUwRrrKk8XTFtq9Q1fBhupj93f05Oq1hkx5XI0A1UjfJRDImXKXPvo29CsijrS8CdKq8vrwZmv6c0zKrkkNk=
              git.mst.edu ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFf6eqkfcSEoO6sctY+fSc/dvUaWrmOz9mfkNmZBqCeh
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true